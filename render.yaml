services:
  - type: web
    name: nova-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.web
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
    plans:
      - type: postgres
        name: nova-db
